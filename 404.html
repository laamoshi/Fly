<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>EthioFly</title>
</head>
<body>

<script>
  // Save full path
  const path = window.location.pathname;

  if (path && path !== "/") {
    sessionStorage.setItem("redirectPath", path);
  }

  // IMPORTANT: preserve base path safely
  const base = window.location.origin;
  window.location.replace(base + "/");
</script>

</body>
</html>
